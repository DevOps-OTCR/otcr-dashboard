name: PR Validation

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - name: Check GitHub workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Render Blueprint
        run: |
          python -m pip install check-jsonschema==0.38.2
          check-jsonschema --schemafile https://render.com/schema/render.yaml.json render.staging.yaml

  frontend:
    name: Frontend typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Keep this version aligned with frontend/package-lock.json.
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --init --ipc=host
    defaults:
      run:
        working-directory: frontend
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        timeout-minutes: 3
        run: npm ci --ignore-scripts
      - name: Verify preinstalled Chromium
        timeout-minutes: 1
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            console.log(`Preinstalled Chromium ${browser.version()}`);
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Lint frontend
        run: npm run lint
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Run frontend unit tests
        run: npm test
      - name: Run navigation browser tests
        timeout-minutes: 5
        run: npm run test:navigation:browser
      - name: Build Pages static export
        env:
          GITHUB_PAGES: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          # Test-only public configuration. PR builds do not use deployment secrets.
          NEXT_PUBLIC_API_URL: https://api.example.test
          NEXT_PUBLIC_MSAL_CLIENT_ID: '00000000-0000-4000-8000-000000000001'
          NEXT_PUBLIC_MSAL_AUTHORITY: https://login.microsoftonline.com/00000000-0000-4000-8000-000000000002
          NEXT_PUBLIC_MSAL_REDIRECT_URI: https://app.example.test/auth/callback
        run: |
          npm run build
          test -s out/index.html

  backend:
    name: Backend typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Apply database migrations
        run: npx --no-install prisma migrate deploy
      - name: Lint backend
        run: npm run lint
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Run unit tests
        run: npm test -- --runInBand
      - name: Build backend
        run: npm run build
