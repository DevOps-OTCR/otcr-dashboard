name: PR Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Lint frontend
        run: npm run lint
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Run frontend unit tests
        run: npm test
      - name: Install Chromium for browser tests
        run: npx --no-install playwright install --with-deps chromium
      - name: Run navigation browser tests
        timeout-minutes: 5
        run: npm run test:navigation:browser
      - name: Build Pages static export
        env:
          GITHUB_PAGES: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          # Test-only public configuration. PR builds do not use deployment secrets.
          NEXT_PUBLIC_API_URL: https://api.example.test
          NEXT_PUBLIC_MSAL_CLIENT_ID: '00000000-0000-4000-8000-000000000001'
          NEXT_PUBLIC_MSAL_AUTHORITY: https://login.microsoftonline.com/00000000-0000-4000-8000-000000000002
          NEXT_PUBLIC_MSAL_REDIRECT_URI: https://app.example.test/auth/callback
        run: |
          npm run build
          test -s out/index.html

  backend:
    name: Backend typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Lint backend
        run: npm run lint
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Run unit tests
        run: npm test -- --runInBand
      - name: Build backend
        run: npm run build

  pages:
    name: Deploy validated frontend
    needs: [frontend, backend]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy-github-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_GEOAPIFY_API_KEY: ${{ secrets.NEXT_PUBLIC_GEOAPIFY_API_KEY }}
      NEXT_PUBLIC_GOOGLE_CALENDAR_EMBED_URL: ${{ secrets.NEXT_PUBLIC_GOOGLE_CALENDAR_EMBED_URL }}
      NEXT_PUBLIC_MSAL_AUTHORITY: ${{ secrets.NEXT_PUBLIC_MSAL_AUTHORITY }}
      NEXT_PUBLIC_MSAL_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_MSAL_CLIENT_ID }}
      NEXT_PUBLIC_MSAL_REDIRECT_URI: ${{ secrets.NEXT_PUBLIC_MSAL_REDIRECT_URI }}
