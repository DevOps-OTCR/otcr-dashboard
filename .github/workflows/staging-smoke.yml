name: Verify staging deployment

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Staging deployment smoke check
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging') ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment.environment == 'staging - otcr-dashboard-staging' ||
        github.event.deployment.environment == 'staging - otcr-dashboard-staging-api'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Verify deployed staging revision and browser connectivity
        env:
          STAGING_FRONTEND_URL: https://otcr-dashboard-staging.onrender.com
          STAGING_API_URL: https://otcr-dashboard-staging-api.onrender.com
        run: node frontend/scripts/check-staging.cjs
