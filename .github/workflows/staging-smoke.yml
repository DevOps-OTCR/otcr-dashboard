name: Verify staging deployment

on:
  workflow_run:
    workflows: [PR Validation]
    types: [completed]
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Staging deployment smoke check
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    concurrency:
      group: staging-smoke
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'staging' }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Verify deployed staging revision and browser connectivity
        env:
          STAGING_FRONTEND_URL: https://otcr-dashboard-staging.onrender.com
          STAGING_API_URL: https://otcr-dashboard-staging-api.onrender.com
        run: node frontend/scripts/check-staging.cjs
